    <path d="M112 30c-6 7-17 8-21 2-3-4 1-9 5-7 3 1.5 2 5-1 5" stroke-width="1.6"/>
    <path d="M128 30c6 7 17 8 21 2 3-4-1-9-5-7-3 1.5-2 5 1 5" stroke-width="1.6"/>
